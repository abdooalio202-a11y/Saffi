<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>صفّي — منصتك الدراسية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@500;700&family=Amiri:wght@400;700&family=Aref+Ruqaa:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
 --bg:#F3F5FC;--surface:#fff;--surface2:#F5F6FB;--ink:#161937;--ink2:#575D7E;--ink3:#9AA0BD;--line:#E7E9F4;--line2:#D8DBEC;
 --pri:#5B4DFF;--pri2:#4335E8;--brand:#5B4DFF;--brand2:#8E7CFF;--brandSoft:#EEECFF;--priSoft:#EEECFF;
 --acc:#FFB020;--ok:#12B886;--okSoft:#E3F8F0;--bad:#F03E5E;--badSoft:#FFEBEF;--warn:#E8930C;--warnSoft:#FFF4E0;
 --sh:0 1px 2px rgba(22,25,55,.05);--sh2:0 14px 34px -14px rgba(48,40,160,.22);
 --r:22px;--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--hd:"Alexandria","IBM Plex Sans Arabic",sans-serif}
.dark{--bg:#0E1024;--surface:#171A35;--surface2:#13152C;--ink:#F2F3FA;--ink2:#AEB3D0;--ink3:#6E7396;--line:#262A4D;--line2:#33385F;--pri:#7D70FF;--pri2:#6A5CFF;--brand:#7D70FF;--brandSoft:#25224F;--priSoft:#25224F;--okSoft:#0F2E28;--badSoft:#341827;--warnSoft:#33270F;--sh:none;--sh2:0 14px 34px -14px rgba(0,0,0,.6)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;line-height:1.65;-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,textarea{font-family:inherit;color:var(--ink)}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.app{max-width:620px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:calc(96px + var(--sb))}
.scr{animation:in .35s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.pad{padding:0 20px}
h1,h2,h3,.hd{font-family:var(--hd);letter-spacing:-.01em}
/* top bar */
.top{padding:calc(20px + var(--st)) 20px 10px;display:flex;align-items:center;gap:12px}
.avatar{width:44px;height:44px;border-radius:14px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-family:var(--hd);font-weight:700;font-size:18px}
.hi small{display:block;color:var(--ink3);font-size:12.5px}
.hi b{font-family:var(--hd);font-size:18px;font-weight:700}
.iconbtn{width:42px;height:42px;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;margin-inline-start:auto;color:var(--ink2)}
.gpill{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600}
/* hero */
.hero{margin:12px 20px 0;border-radius:24px;padding:24px 22px;color:#fff;background:#0b1220;position:relative;overflow:hidden;isolation:isolate}
.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(420px 220px at 15% 0%,rgba(20,184,166,.45),transparent 60%),radial-gradient(320px 200px at 100% 120%,rgba(14,159,110,.35),transparent 60%);z-index:-1}
.hero:after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:22px 22px;mask-image:linear-gradient(to left,#000,transparent 70%);z-index:-1}
.hero h2{margin:0;font-size:22px;font-weight:700}
.hero p{margin:6px 0 18px;color:rgba(255,255,255,.72);font-size:14px}
.hero .go{display:inline-flex;align-items:center;gap:8px;background:#fff;color:#0b1220;font-weight:700;border-radius:12px;padding:11px 16px;font-size:14.5px}
.hero .emoji{position:absolute;left:20px;top:20px;width:56px;height:56px;border-radius:16px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);display:grid;place-items:center;color:#5eead4}
.hero .emoji svg.i{width:28px;height:28px}
/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 20px 0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 12px;text-align:start}
.stat b{display:block;font-family:var(--hd);font-size:22px;font-weight:700;line-height:1.2}
.stat span{font-size:12px;color:var(--ink3)}
.h{display:flex;align-items:center;justify-content:space-between;margin:28px 20px 12px}
.h h3{margin:0;font-size:16px;font-weight:700}
.h button,.h a{color:var(--ink2);font-size:13px;font-weight:600}
/* subject tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 20px}
.tile{background:var(--surface)!important;border:1px solid var(--line)!important;border-radius:18px;padding:16px;text-align:start;display:flex;flex-direction:column;gap:2px;min-height:122px;transition:transform .15s,box-shadow .2s,border-color .2s}
.tile:hover{box-shadow:var(--sh2);border-color:var(--line2)!important}
.tile:active{transform:scale(.98)}
.tile .sq{width:40px;height:40px;border-radius:12px;margin:0 0 auto}
.tile b{font-family:var(--hd);font-size:15.5px;font-weight:600;margin-top:12px}
.tile small{color:var(--ink3);font-size:12px}
.sq{display:grid;place-items:center;border-radius:12px}
.sq svg.i{width:20px;height:20px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 20px}
.sub{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 8px;text-align:center}
.sub .sq{width:44px;height:44px;margin:0 auto 8px}
/* lists */
.list{padding:0 20px;display:grid;gap:8px}
.rowc{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:12px;text-align:start;width:100%;transition:border-color .2s}
.rowc:hover{border-color:var(--line2)}
.rowc .sq{width:40px;height:40px;margin:0}
.rowc .t{flex:1;min-width:0}
.rowc .t b{display:block;font-size:14.5px;font-weight:600}
.rowc .t small{color:var(--ink3);font-size:12px}
.badge{font-family:var(--hd);font-weight:700;font-size:14px;border-radius:10px;padding:5px 10px;min-width:48px;text-align:center}
.empty{text-align:center;color:var(--ink3);padding:28px;background:var(--surface);border:1px dashed var(--line2);border-radius:16px;margin:0 20px;font-size:13.5px}
/* nav */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:620px;padding:8px 16px calc(10px + var(--sb));background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:saturate(1.4) blur(16px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(var(--nc,4),1fr);z-index:30}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--ink3);padding:6px 0}
.nav button svg{width:22px;height:22px}
.nav button.on{color:var(--ink)}
.dot{padding:4px 16px;border-radius:999px;display:grid;place-items:center;transition:.2s}
.nav button.on .dot{background:var(--priSoft)}
@media(min-width:1000px){
 .app{max-width:none;margin:0 0 0 0;padding:0 260px 40px 0}
 .app>.scr{max-width:760px;margin:0 auto}
 .nav{top:0;bottom:auto;right:0;left:auto;transform:none;width:240px;max-width:none;height:100vh;grid-template-columns:1fr;align-content:start;gap:4px;padding:28px 16px;border-top:0;border-left:1px solid var(--line)}
 .nav .nbrand{display:flex!important}
 .nav button{flex-direction:row;gap:10px;font-size:14.5px;padding:10px 12px;border-radius:12px;justify-content:flex-start}
 .nav button.on{background:var(--priSoft)}.nav button.on .dot{background:none}
 .dot{padding:0}
 .tiles{grid-template-columns:repeat(3,1fr)}
 .ebottom,.ov .sheet{max-width:760px!important}
}
/* subject header */
.shead{padding:calc(16px + var(--st)) 20px 30px;color:#fff;border-radius:0 0 28px 28px;position:relative;overflow:hidden;background:#0b1220!important;isolation:isolate}
.shead:after{content:"";position:absolute;inset:0;background:radial-gradient(380px 200px at 10% 10%,var(--sc,#14b8a6),transparent 65%);opacity:.55;z-index:-1}
.back{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);display:grid;place-items:center;color:#fff}
.shead h1{margin:16px 0 4px;font-size:26px;font-weight:700}
.shead p{margin:0;color:rgba(255,255,255,.7);font-size:13.5px}
.shead .big{position:absolute;left:20px;top:calc(56px + var(--st));width:64px;height:64px;border-radius:18px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);display:grid;place-items:center;color:#fff}
.shead .big svg.i{width:30px;height:30px}
.quizcard{width:100%;display:flex;align-items:center;gap:14px;text-align:start;color:var(--ink);border-radius:20px;padding:18px 18px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--sh2)}
.quizcard b{display:block;font-family:var(--hd);font-size:22px;font-weight:700}
.quizcard small{color:var(--ink3);font-size:12.5px}
.quizcard .play{margin-inline-start:auto;width:48px;height:48px;border-radius:14px;background:var(--brand);color:#fff;display:grid;place-items:center;flex:0 0 auto}
.etype{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;gap:12px;align-items:center;text-align:start;width:100%;transition:border-color .2s}
.etype:hover{border-color:var(--line2)}
.etype .sq{margin:0;width:44px;height:44px}
.etype b{font-size:15px;font-weight:600;display:block}
.etype small{color:var(--ink3);font-size:12.5px}
.unit{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.unit .num{width:36px;height:36px;border-radius:11px;background:var(--surface2);border:1px solid var(--line);display:grid;place-items:center;font-family:var(--hd);font-weight:700;font-size:13px;color:var(--ink2)}
.unit b{font-size:14.5px;font-weight:600}
.unit small{display:block;color:var(--ink3);font-size:12px}
.tabs{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;margin:-20px 20px 0;position:relative;z-index:2}
.tabs button{flex:1;padding:9px;border-radius:10px;font-weight:600;font-size:14px;color:var(--ink2)}
.tabs button.on{background:var(--ink);color:var(--bg)}
.btnp{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:var(--ink);color:var(--bg);font-weight:700;font-size:15.5px;border-radius:14px;padding:15px;transition:transform .1s,opacity .2s}
.btnp:active{transform:scale(.99)}
.btnp.orange{background:var(--brand);color:#fff}
.btns{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:var(--surface);color:var(--ink);font-weight:600;font-size:15px;border-radius:14px;padding:14px;border:1px solid var(--line)}
.btnp:disabled{opacity:.35}
/* exam */
.ebar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);padding:calc(12px + var(--st)) 16px 12px;border-bottom:1px solid var(--line)}
.erow{display:flex;align-items:center;gap:10px}
.erow .x{width:40px;height:40px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center}
.erow .tt{flex:1;min-width:0}
.erow .tt b{font-size:14.5px;font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.erow .tt small{color:var(--ink3);font-size:12px}
.timer{font-family:var(--hd);font-variant-numeric:tabular-nums;font-weight:700;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:7px 12px;font-size:14px;direction:ltr}
.timer.low{color:var(--bad);border-color:var(--bad)}
.prog{height:4px;background:var(--line);border-radius:9px;margin-top:12px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--brand);border-radius:9px;transition:width .3s}
.qnav{display:flex;gap:6px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.qnav button{flex:0 0 auto;min-width:34px;height:32px;padding:0 10px;border-radius:9px;background:var(--surface);border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--ink2)}
.qnav button.done{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.qnav button.rt{background:var(--okSoft);color:var(--ok);border-color:transparent}.qnav button.hf{background:var(--warnSoft);color:var(--warn);border-color:transparent}.qnav button.wr{background:var(--badSoft);color:var(--bad);border-color:transparent}
.official{margin:14px 16px 0;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;font-family:"Noto Naskh Arabic",serif;font-size:12.5px;display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center}
.official .c{text-align:center;font-weight:700;font-size:13.5px}
.official .l{text-align:left}
.onote{margin:10px 16px 0;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:13px;font-weight:600;text-align:center;color:var(--ink2)}
.qcard{margin:12px 16px 0;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;scroll-margin-top:150px}
.qh{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.qh b{font-family:var(--hd);font-size:14.5px;font-weight:700}
.qh span{font-size:12px;color:var(--ink2);background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.qh .sc{font-weight:700}
.qh.qz{background:none;color:inherit}.qh.qz span{background:var(--surface2);color:var(--ink2)}
.qh .kt{margin-inline-start:auto}
.part{padding:12px 16px 4px}
.ph{font-weight:700;font-size:14px;color:var(--ink);display:flex;justify-content:space-between;gap:8px;margin-bottom:6px;font-family:"Noto Naskh Arabic",serif}
.ph em{font-style:normal;color:var(--ink3);font-size:12px;font-family:"IBM Plex Sans Arabic";white-space:nowrap}
.item{padding:10px 0 12px;border-top:1px dashed var(--line)}
.part .item:first-of-type{border-top:0}
.iq{font-size:16px;font-family:"Noto Naskh Arabic",serif;font-weight:500;line-height:1.9}
.iq .n{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:7px;background:var(--surface2);border:1px solid var(--line);font-size:11.5px;margin-inline-end:6px;font-family:"IBM Plex Sans Arabic";font-weight:700;vertical-align:2px}
.ltr{direction:ltr;text-align:left}
.inp,textarea{width:100%;font-size:15px;border:1px solid var(--line2);border-radius:12px;padding:11px 13px;background:var(--surface);margin-top:8px;transition:.15s}
.inp:focus,textarea:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px var(--priSoft)}
textarea{min-height:76px;resize:vertical}
.opts{display:grid;gap:6px;margin-top:8px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{display:flex;align-items:center;gap:10px;border:1px solid var(--line2);background:var(--surface);border-radius:12px;padding:10px 12px;font-size:14.5px;text-align:start;transition:.12s}
.opt:hover{border-color:var(--ink3)}
.opt .k{width:26px;height:26px;border-radius:8px;border:1px solid var(--line2);display:grid;place-items:center;font-size:12px;font-weight:700;flex:0 0 auto;background:var(--surface2)}
.opt.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink) inset}
.opt.on .k{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.opt.right{border-color:var(--ok);background:var(--okSoft);box-shadow:none}.opt.right .k{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--badSoft);box-shadow:none}.opt.wrong .k{background:var(--bad);border-color:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.fb{font-size:13px;margin-top:8px;border-radius:10px;padding:9px 12px;border:1px solid transparent}
.fb.ok{background:var(--okSoft);color:var(--ok)}
.fb.no{background:var(--badSoft);color:var(--bad)}
.fb.half{background:var(--warnSoft);color:var(--warn)}
.fb .ma{color:var(--ink);display:block;margin-top:4px}
.rep{display:inline-flex;align-items:center;gap:6px;margin:2px 0 10px;color:var(--ink3);font-size:12.5px;font-weight:600}
.ebottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:620px;padding:12px 16px calc(12px + var(--sb));background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--line);z-index:25}
@media(min-width:1000px){.ebottom{left:auto;right:calc(50% - 380px + 130px);transform:none}}
.erow2{display:flex;gap:10px;align-items:center}.erow2 .btnp{flex:1}.mini{font-family:var(--hd);font-weight:700;color:var(--ink2);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 14px}
.avail{text-align:center;font-size:12.5px;color:var(--ink3);margin-bottom:8px}
/* config */
.cfg{margin:12px 16px 0;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.cfgh{display:flex;align-items:center;gap:10px;margin-bottom:12px}.cfgh b{font-family:var(--hd);font-size:15px;font-weight:600}
.sn{width:26px;height:26px;border-radius:8px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:12px;font-weight:700}
.tg{margin-inline-start:auto;font-size:11.5px;font-weight:600;color:var(--ink2);background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--surface);border:1px solid var(--line2);border-radius:10px;padding:8px 12px;font-weight:600;font-size:13px;color:var(--ink2);transition:.12s}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip .cnt{font-style:normal;font-size:11px;opacity:.6;margin-inline-start:4px}
.cklist{display:grid;gap:6px;margin-top:12px}
.ck{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--surface2);font-size:14px;cursor:pointer}
.ck input{width:18px;height:18px;accent-color:var(--brand)}.ck span{flex:1}.ck em{font-style:normal;color:var(--ink3);font-size:12px}
.ugrp{background:var(--surface2);border:1px solid var(--line);border-radius:14px;overflow:hidden}.ugrp .ck{background:none}
.urow span{cursor:pointer;font-weight:600}.exp{width:28px;height:28px;border-radius:8px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;transition:.2s}.exp.op{transform:rotate(180deg)}
.lsl{padding:0 10px 10px;display:grid;gap:4px}.lrow{background:var(--surface)!important;border:1px solid var(--line);padding:8px 12px!important;font-size:13.5px!important}
.ck input[data-ind]{opacity:.5}
.radios{display:grid;gap:6px}.radio{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;border:1px solid var(--line2);text-align:start;background:var(--surface)}
.radio b{display:block;font-size:14.5px;font-weight:600}.radio small{color:var(--ink3);font-size:12px}.radio:disabled{opacity:.45}
.rd{width:18px;height:18px;border-radius:50%;border:2px solid var(--line2);flex:0 0 auto}
.radio.on{border-color:var(--ink)}.radio.on .rd{border:5px solid var(--ink)}
.muted2{margin:0;color:var(--ink2);font-size:13px}
.note{margin:16px 20px 0;font-size:12.5px;color:var(--warn);background:var(--warnSoft);border-radius:12px;padding:10px 12px;display:flex;gap:8px;align-items:center}
.note.ok{background:var(--okSoft);color:var(--ok)}
/* result */
.res{padding:calc(24px + var(--st)) 20px 20px;text-align:center}
.ringw{position:relative;width:190px;height:190px;margin:10px auto}
.ringw svg{transform:rotate(-90deg)}
.ringw .v{position:absolute;inset:0;display:grid;place-items:center;align-content:center}
.ringw .v b{font-family:var(--hd);font-size:50px;font-weight:800;line-height:1}
.ringw .v small{color:var(--ink3)}
.res h2{margin:6px 0 2px;font-size:22px}
.res p{color:var(--ink2);margin:0 0 16px;font-size:13.5px}
.qbars{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;text-align:start}

/* sheet */

.sheet{background:var(--surface);width:100%;max-width:620px;border-radius:24px 24px 0 0;padding:10px 20px calc(22px + var(--sb));max-height:92vh;overflow:auto;animation:up .3s cubic-bezier(.2,.8,.2,1);border:1px solid var(--line)}

@keyframes up{from{transform:translateY(40px);opacity:0}}

.oath{background:var(--surface2);border:1px solid var(--line);border-radius:16px;padding:18px;font-family:"Noto Naskh Arabic",serif;font-size:17px;font-weight:700;text-align:center;line-height:2.1}

/* onboarding */
.ob{min-height:100vh;padding:calc(48px + var(--st)) 24px 30px;display:flex;flex-direction:column;max-width:520px;margin:0 auto}

.ob p{text-align:center;color:var(--ink2);margin:8px 0 26px}
.feat{display:grid;gap:8px;margin-bottom:24px}
.feat div{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;font-size:14px}

.stg{margin-bottom:16px}
.stg h4{margin:0 0 8px;font-size:13px;color:var(--ink3);font-weight:600}
.dots{display:flex;gap:6px;justify-content:center;margin-bottom:18px}
.dots i{width:6px;height:6px;border-radius:9px;background:var(--line2)}
.dots i.on{width:22px;background:var(--ink)}
.set{background:var(--surface);border:1px solid var(--line);border-radius:18px;margin:0 20px;overflow:hidden}
.set button,.set .r{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;border-bottom:1px solid var(--line);text-align:start;font-size:14.5px}
.set>*:last-child{border-bottom:0}
.set .sq{margin:0;width:34px;height:34px;border-radius:10px}
.set .ch{margin-inline-start:auto;color:var(--ink3)}
.sw{margin-inline-start:auto;width:44px;height:26px;border-radius:99px;background:var(--line2);position:relative;transition:.2s}
.sw:after{content:"";position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw.on{background:var(--brand)}.sw.on:after{right:21px}
.toast{position:fixed;top:calc(16px + var(--st));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-size:13.5px;z-index:70;font-weight:600;animation:in .2s;box-shadow:var(--sh2)}

/* ورقة الأسئلة */
.paper{margin:14px 12px 0;background:#fffefa;color:#14161c;border:1px solid #e3dfd3;border-radius:6px;box-shadow:0 1px 0 #e9e5da,0 12px 30px -14px rgba(0,0,0,.25);padding:6px 4px 18px;font-family:"Noto Naskh Arabic",serif;position:relative}

.paper .onote{margin:10px 12px 4px;background:none;border:0;padding:4px;text-decoration:underline;text-underline-offset:5px;color:inherit;font-size:14px}

.paper .qh b{font-family:"Noto Naskh Arabic",serif;font-size:17px;font-weight:700}

.paper .qh .kt{opacity:.6;font-size:12.5px}
.paper .part{padding:8px 8px 2px}
.paper .ph{font-size:15.5px}
.paper .item{border-top:0;padding:6px 0 10px}
.paper .iq{font-size:16.5px}
.paper .iq .n{background:none;border:0;width:auto;margin-inline-end:4px;font-family:"Noto Naskh Arabic",serif;font-size:15px}
.paper .iq .n{display:inline}.paper .iq .n:after{content:"- "}
.paper .inp,.paper textarea{background:transparent;border:0;border-bottom:1.5px dotted #9b9483;border-radius:0;padding:6px 4px;font-family:"Noto Naskh Arabic",serif;font-size:16px;color:inherit;margin-top:2px;box-shadow:none}
.paper textarea{min-height:58px;background-image:repeating-linear-gradient(transparent,transparent 29px,rgba(155,148,131,.45) 29px,rgba(155,148,131,.45) 30px);border-bottom:0;line-height:30px}
.paper .inp:focus,.paper textarea:focus{border-color:var(--brand);box-shadow:none}
.paper .opts{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:6px}
.paper .opts.two{display:flex}
.paper .opt{background:none;border:0;padding:4px 2px;font-family:"Noto Naskh Arabic",serif;font-size:15.5px;color:inherit;box-shadow:none!important}
.paper .opt .k{width:24px;height:24px;border-radius:50%;background:none;border:1.5px solid #9b9483;font-family:"Noto Naskh Arabic",serif}
.paper .opt.on .k{background:var(--brand);border-color:var(--brand);color:#fff}
.paper .opt.right{background:none}.paper .opt.right .k{background:var(--ok);border-color:var(--ok)}.paper .opt.right span:last-child{color:var(--ok);font-weight:700}
.paper .opt.wrong{background:none}.paper .opt.wrong .k{background:var(--bad);border-color:var(--bad)}.paper .opt.wrong span:last-child{color:var(--bad);text-decoration:line-through}
.paper .fb{font-family:"IBM Plex Sans Arabic";font-size:12.5px;border-radius:8px}
.paper .rep{font-family:"IBM Plex Sans Arabic"}
.wz{display:inline-block;font-family:"IBM Plex Sans Arabic";font-size:10.5px;font-weight:700;color:#b7791f;background:#fdf5e6;border:1px solid #f1dcae;border-radius:6px;padding:0 6px;margin-inline-end:6px;vertical-align:3px}
.wzrow{border-color:#f1dcae!important;background:linear-gradient(90deg,#fffaf0,var(--surface))!important}
.dark .wzrow{background:var(--surface)!important;border-color:#4a3a17!important}
.psg{margin:4px 2px 10px;padding:12px 14px;border:1px solid #d9d3c3;border-radius:4px;background:rgba(0,0,0,.015);font-family:"Noto Naskh Arabic",serif;font-size:17px;line-height:2.1;text-align:justify}
.dark .psg{border-color:#3a4356}
.psg u,.iq u{text-decoration-thickness:1.5px;text-underline-offset:6px}
.paper .ph em{font-style:normal;font-size:13px;opacity:.7;font-family:"Noto Naskh Arabic",serif;white-space:nowrap}
.paper .part+.part{border-top:1px dotted #e0dacb;margin-top:4px}
.paper textarea{resize:none}

function runGen(n){const o=GEN[n]();o.k='calc';o.m=o.m||('الناتج: '+o.ans);return o}
function unitsFor(gk,sub){return (CUR[gk]&&CUR[gk][sub])||null}
/* بناء مجمع الأسئلة: فصل محدد أو المادة كلها */
function poolFor(gk,sub,unit){
 const us=unitsFor(gk,sub);if(!us)return null;
 const sel=unit>=0?[us[unit]]:us;
 const items=[];sel.forEach(u=>{u.q.forEach(q=>items.push(q));u.gen.forEach(g=>{for(let i=0;i<(sub==='math'?14:4);i++)items.push({k:'calc',gen:g})})});
 return items;
}

function poolFor(gk,sub,unit){
 const us=unitsFor(gk,sub);if(!us)return null;
 const items=[];const per=sub==='math'?14:4;
 const addL=l=>{l.q.forEach(q=>items.push(q));l.gen.forEach(g=>{for(let i=0;i<per;i++)items.push({k:'calc',gen:g})})};
 if(unit&&unit.ls){unit.ls.forEach(key=>{const[a,b]=key.split('-').map(Number);const l=us[a]&&us[a].ls[b];if(l)addL(l)});return items}
 const sel=Array.isArray(unit)?unit.map(i=>us[i]).filter(Boolean):unit>=0?[us[unit]]:us;
 sel.forEach(u=>u.ls.forEach(addL));
 return items;
}
function stats(gk,sub){
 const us=unitsFor(gk,sub)||[];const byK={};let total=0;
 const units=us.map(u=>{let c=u.q.length;u.q.forEach(q=>{byK[q.k]=(byK[q.k]||0)+1});if(u.gen.length){byK.calc=(byK.calc||0)+u.gen.length*10;c+=u.gen.length*10}total+=c;return{n:u.n,c,gen:u.gen.length,ls:u.ls.map(l=>({n:l.n,c:l.q.length+l.gen.length*10,imp:l.implicit}))}});
 return{units,byK,total};
}

/* =====================================================================

   التخزين: Supabase (site_config + questions) أو هذا الجهاز إذا Supabase غير مربوط

const ADM_DEF={
 site:{notice:''},
 grades:{},subs:{},gsub:{},units:{},hideQ:[],papers:[],
 exam:{ai:false,m:{nQ:4},h:{nQ:5},f:{nQ:6,best:5},fn:{nQ:5},nP:2,minI:2,maxI:6,choose:true,
  h1:'جمهورية العراق',h2:'وزارة التربية',h3:'المديرية العامة للتقويم والامتحانات',wm:'نموذج تدريبي · منصة صفّي'}
};
const clone=o=>JSON.parse(JSON.stringify(o));
function admMerge(c){c=c||{};const o=clone(ADM_DEF);for(const k in c){if(k==='exam')continue;o[k]=c[k]}
 o.exam=Object.assign(clone(ADM_DEF.exam),c.exam||{});if(o.exam.maxI===4&&!o.exam.maxISet)o.exam.maxI=6;['m','h','f','fn'].forEach(t=>o.exam[t]=Object.assign({},ADM_DEF.exam[t],(c.exam||{})[t]||{}));return o}
var ADM={cfg:clone(ADM_DEF),qs:[],user:null,isAdmin:false,loaded:false};

const qToRow=q=>({grades:q.grades,subject:q.sub,unit:q.unit,lesson:q.les||null,kind:q.k,wz:!!q.wz,active:true,
 data:{q:q.q,o:q.o,a:q.a,m:q.m,kw:q.kw,alts:q.alts,text:q.text,subs:q.subs,ans:q.ans,year:q.year}});
const rowToQ=r=>Object.assign({id:r.id,grades:r.grades||[],sub:r.subject,unit:r.unit,les:r.lesson,k:r.kind,wz:r.wz,created:r.created_at},r.data||{});
// Supabase يرجّع 1000 سؤال بالطلب الواحد كحد أقصى، فنجيب الأسئلة على دفعات
async function admFetchAllQs(){const step=1000;let all=[],from=0;
 for(;;){const {data,error}=await SB.from('questions').select('*').eq('active',true).order('id',{ascending:true}).range(from,from+step-1);
  if(error)throw error;all=all.concat(data||[]);if(!data||data.length<step)break;from+=step}
 return all}
const AST={
 async load(){
  if(SB){try{const [a,b]=await Promise.all([SB.from('site_config').select('data').eq('id','main').maybeSingle(),admFetchAllQs()]);
    if(a&&a.data)ADM.cfg=admMerge(a.data.data);if(b)ADM.qs=b.map(rowToQ)}catch(e){console.warn('admin load',e)}}
  else{const d=LS.get('adm',null);if(d){ADM.cfg=admMerge(d.cfg);ADM.qs=d.qs||[]}}
  ADM.loaded=true;
 },
 saveLocal(){LS.set('adm',{cfg:ADM.cfg,qs:ADM.qs})},
 async saveCfg(){if(SB){const {error}=await SB.from('site_config').upsert({id:'main',data:ADM.cfg,updated_at:new Date().toISOString()});if(error)throw error}else this.saveLocal()},
 async addQs(list){
  if(SB){for(let i=0;i<list.length;i+=500){const {data,error}=await SB.from('questions').insert(list.slice(i,i+500).map(qToRow)).select();if(error)throw error;data.forEach(r=>ADM.qs.push(rowToQ(r)))}}
  else{list.forEach(q=>{q.id='l'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);ADM.qs.push(q)});this.saveLocal()}

 for(const k in C.subs)SUB[k]=Object.assign({},SUB[k]||{n:k,ic:'book',c:'#5B4DFF'},C.subs[k]);
 G0.forEach(st=>st.g.forEach(x=>{const gk=x[0],o=C.grades[gk]||{},gr=GR[gk];gr.n=o.n||x[1];gr.hide=!!o.hide;

  CUR[gk]=CUR[gk]||{};gr.subs.forEach(s=>{if(!CUR[gk][s])CUR[gk][s]=[]})}));
 const own=(gk,s,i)=>{const arr=CUR[gk][s],u=arr[i];if(u._own)return u;const c=Object.assign({},u,{_own:1,q:u.q.slice(),gen:u.gen.slice(),ls:u.ls.map(l=>Object.assign({},l,{q:l.q.slice(),gen:l.gen.slice()}))});arr[i]=c;return c};
 const findU=(gk,s,n,mk)=>{const arr=CUR[gk][s];let i=arr.findIndex(u=>u.n===n);if(i<0){if(!mk)return null;arr.push({n,gen:[],q:[],ls:[],_own:1,custom:1});i=arr.length-1}return own(gk,s,i)};
 const findL=(u,n)=>{if(!u.ls.length)u.ls.push({n:u.n,q:[],gen:[],implicit:1});if(!n)return u.ls[0];let l=u.ls.find(x=>x.n===n);if(!l){l={n,q:[],gen:[]};u.ls.push(l)}return l};
 const UO=C.units||{};
 for(const key in UO){const [gk,s]=key.split('|');if(!CUR[gk]||!CUR[gk][s])continue;const o=UO[key];
  (o.add||[]).forEach(n=>findU(gk,s,n,true));

  for(const un in (o.addLs||{})){const u=findU(gk,s,un,false);if(u)(o.addLs[un]||[]).forEach(ln=>{if(!u.ls.length)u.ls.push({n:u.n,q:u.q.slice(),gen:u.gen.slice(),implicit:1});findL(u,ln)})}
 }
 (ADM.qs||[]).forEach(q=>{if(q.active===false)return;(q.grades||[]).forEach(gk=>{if(!CUR[gk]||!CUR[gk][q.sub])return;const u=findU(gk,q.sub,q.unit||'أسئلة مضافة',true);const l=findL(u,q.les);const it=admItem(q);u.q.push(it);l.q.push(it)})});
 for(const key in UO){const [gk,s]=key.split('|');if(!CUR[gk]||!CUR[gk][s])continue;const o=UO[key];
  (o.hideLs||[]).forEach(k=>{const [un,ln]=k.split('>');const i=CUR[gk][s].findIndex(u=>u.n===un);if(i<0)return;const u=own(gk,s,i);const l=u.ls.find(x=>x.n===ln);if(!l)return;u.ls=u.ls.filter(x=>x!==l);const rm=new Set(l.q);u.q=u.q.filter(x=>!rm.has(x))});
  if((o.hide||[]).length)CUR[gk][s]=CUR[gk][s].filter(u=>!o.hide.includes(u.n));
  if(o.order)CUR[gk][s].sort((p,q)=>{const a=o.order.indexOf(p.n),b=o.order.indexOf(q.n);return (a<0?999:a)-(b<0?999:b)});
 }
 const H=new Set(C.hideQ||[]);
 if(H.size){const done=new Set();for(const gk in CUR)for(const s in CUR[gk])CUR[gk][s].forEach(u=>{if(done.has(u))return;done.add(u);const f=x=>!H.has(s+'|'+(x.q||x.text));u.q=u.q.filter(f);u.ls.forEach(l=>l.q=l.q.filter(f))})}
}

function assignMarks(qs,best){

 qs.forEach((q,qi)=>{const qm=base+(qi<rem?1:0);q.marks=qm;const w=q.parts.map(p=>p.k==='psg'?2:1),ws=w.reduce((a,c)=>a+c,0);let acc=0;
  q.parts.forEach((p,pi)=>{const m=pi===q.parts.length-1?qm-acc:Math.round(qm*w[pi]/ws);acc+=m;p.marks=m;const cnt=p.choose||p.items.length,per=m/cnt;p.items.forEach((it,i)=>{it.mk=per;it.id=`q${qi}p${pi}i${i}`})})});
}

function admParseBulk(t,base){
 const out=[];let P=null;base=Object.assign({},base);
 String(t).split('\n').forEach(L=>{L=L.trim();if(!L)return;
  if(L[0]==='@'){const n=L.slice(1).trim();if(n){base.unit=n;base.les=null}return}
  if(L[0]==='%'){base.les=L.slice(1).trim()||null;return}
  let sub=false;if(L[0]==='>'){sub=true;L=L.slice(1).trim()}
  const f=L.split('|').map(x=>x.trim());let code=nz(f[0]).replace(/\s+/g,' '),wz=false;if(/^W/.test(f[0])){wz=true;code=f[0].slice(1)}
  if(code==='P'||code==='نص'){P=Object.assign({},base,{k:'psg',text:f[1],subs:[],wz});out.push(P);return}
  const k=KCODE[code]||KCODE[f[0]];if(!k||!f[1])return;let q={k,q:f[1],wz};
  if(k==='mcq'){q.o=f.slice(2).filter(Boolean);if(q.o.length<2)return}
  else if(k==='tf')q.a=/^(ص|صح|صحيح|t|true)$/i.test(f[2]||'');
  else if(k==='blank'||k==='ext'){if(!f[2])return;q.a=f[2]}
  else if(k==='calc'){q.ans=+toEn(f[2]);q.m=f[3]||'';if(isNaN(q.ans))return}
  else{if(!f[2])return;q.m=f[2];q.kw=f[3]||'';q.alts=(f.slice(4).join('\n')).trim()}
  if(sub){if(P)P.subs.push(q);return}
  out.push(Object.assign({},base,q));
 });
 return out.filter(q=>q.k!=='psg'||q.subs.length);
}

async function filesToPages(files){
 const pages=[];
 for(const f of files){
  if(/^image\//.test(f.type)){pages.push({image:await imgToJpeg(await fileToImg(f))});continue}
  if(f.type==='application/pdf'||/\.pdf$/i.test(f.name)){
   const lib=await loadPdfJs();const doc=await lib.getDocument({data:await f.arrayBuffer()}).promise;
   for(let i=1;i<=doc.numPages;i++){pdfSt({msg:`قراءة الصفحة ${toAr(i)} من ${toAr(doc.numPages)}…`});const pg=await doc.getPage(i);
    const tc=await pg.getTextContent();const text=tc.items.map(x=>x.str+(x.hasEOL?'\n':' ')).join('').replace(/[ \t]+/g,' ').trim();
    if(text.replace(/\s/g,'').length>80&&/[؀-ۿ]/.test(text)&&!/[ﭐ-﻿]{5,}/.test(text))pages.push({text});
    else{const vp=pg.getViewport({scale:1});const sc=Math.min(2,1500/vp.width);const v2=pg.getViewport({scale:sc});const c=document.createElement('canvas');c.width=v2.width;c.height=v2.height;await pg.render({canvasContext:c.getContext('2d'),viewport:v2}).promise;pages.push({image:c.toDataURL('image/jpeg',.72).split(',')[1]})}}
  }
 }
 return pages;
}
function fileToImg(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=r.result};r.readAsDataURL(f)})}
function imgToJpeg(img){const s=Math.min(1,1500/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.75).split(',')[1]}
const KSHORT={mcq:'m',tf:'t',blank:'b',def:'d',why:'w',fn:'f',loc:'l',diff:'x',tr:'h',irab:'e',fix:'k',calc:'c',ext:'o'};
const clean1=s=>String(s==null?'':s).replace(/\|/g,'/').replace(/\s*\n\s*/g,' ').trim();
function qToLine(q,yr,wzAll){
 const wz=wzAll||q.wz;const tag=wz&&yr&&q.k!=='psg'?` (وزاري ${yr})`:'';const c=(wz?'W':'')+(KSHORT[q.k]||'');
 if(q.k==='psg'){return [`${wz?'WP':'نص'} | ${clean1(q.text)}`].concat((q.subs||[]).map(s=>'> '+qToLine(s,'',false))).join('\n')}
 if(!KSHORT[q.k])return '';
 const Q=clean1(q.q)+tag;
 if(q.k==='mcq'){const o=(q.o||[]).map(clean1).filter(Boolean);return o.length>=2?`${c} | ${Q} | ${o.join(' | ')}`:''}
 if(q.k==='tf')return `${c} | ${Q} | ${q.a===true||q.a==='ص'||q.a==='صح'?'صح':'خطأ'}`;
 if(q.k==='blank'||q.k==='ext')return q.a?`${c} | ${Q} | ${clean1(Array.isArray(q.a)?q.a.join('/'):q.a)}`:'';
 if(q.k==='calc')return isNaN(+q.ans)?'':`${c} | ${Q} | ${+q.ans} | ${clean1(q.m)}`;
 return q.m?`${c} | ${Q} | ${clean1(q.m)}${q.kw?' | '+clean1(q.kw):''}`:'';
}
async function admPdf(files){
 const A=V.ad;files=[...(files||[])];if(!files.length)return;
 // ملفات نص جاهزة (txt): تنقرى مباشرة بدون ذكاء اصطناعي
 const txts=files.filter(f=>/\.txt$/i.test(f.name)||f.type==='text/plain');
 if(txts.length){let t='';for(const f of txts)t+=(await f.text())+'\n';A.imp=((A.imp||'').trim()+'\n'+t).trim();
  const n=admParseBulk(A.imp,{grades:[A.g],sub:A.s,unit:A.impU||'أسئلة مضافة',les:null}).length;
  pdfSt({busy:0,msg:`انقرى الملف: تم التعرف على ${toAr(n)} سؤال. راجعهن بالمربع واضغط «أضف».`,err:!n});
  files=files.filter(f=>!txts.includes(f));const fi=document.getElementById('pdff');if(fi)fi.value='';if(!files.length)return}
 pdfSt({busy:1,done:0,total:1,msg:'جاري فتح الملف…',err:0});
 try{
  const pages=await filesToPages(files);if(!pages.length)throw new Error('ما لگيت صفحات بالملف');
  if(!SB){const txt=pages.filter(p=>p.text).map(p=>p.text).join('\n\n');A.imp=(A.imp?A.imp+'\n':'')+txt;
   pdfSt({busy:0,msg:txt?`انقرى نص ${toAr(pages.length)} صفحة ونزل بالمربع. رتّب كل سؤال بسطر حسب «طريقة الكتابة» تحت، أو اربط Supabase حتى يصير التعرف تلقائي.`:'الملف صور ممسوحة — التعرف عليه يحتاج Supabase ودالة extract.',err:!txt});return}
  const us=(unitsFor(A.g,A.s)||[]).map(u=>u.n);
  const batches=[];let cur=[],w=0;pages.forEach(p=>{const pw=p.image?3:1;if(cur.length&&w+pw>6){batches.push(cur);cur=[];w=0}cur.push(p);w+=pw});if(cur.length)batches.push(cur);
  let total=0,lastU=null,fails=0;
  for(let bi=0;bi<batches.length;bi++){
   pdfSt({done:bi,total:batches.length,msg:`التعرف على الأسئلة… الجزء ${toAr(bi+1)} من ${toAr(batches.length)} (${toAr(total)} سؤال لحد الآن)`});
   const r=await SB.functions.invoke('extract',{body:{pages:batches[bi],grade:GR[A.g].n,subject:SUB[A.s].n,units:us,gen:A.pdfGen!==false}});
   if(r.error||!r.data||!Array.isArray(r.data.questions)){fails++;continue}
   const lines=[];r.data.questions.forEach(q=>{const un=q.unit&&us.includes(q.unit)?q.unit:null;if(un&&un!==lastU){lines.push('@'+un);lastU=un}const L=qToLine(q,A.pdfYr||q.year||'',!!A.pdfWz);if(L){lines.push(L);total++}});
   if(lines.length)A.imp=(A.imp?A.imp.trim()+'\n':'')+lines.join('\n');
  }
  if(!total&&fails===batches.length){const txt=pages.filter(p=>p.text).map(p=>p.text).join('\n\n');if(txt)A.imp=(A.imp?A.imp+'\n':'')+txt;
   pdfSt({busy:0,err:1,msg:'القراءة الذكية ما اشتغلت (دالة extract مو منشورة بـ Supabase أو مفتاح Anthropic ناقص). '+(txt?'نزّلت نص الملف بالمربع حتى ترتبه.':'الملف صور ممسوحة، فيحتاج القراءة الذكية.')});return}
  pdfSt({busy:0,msg:`تم التعرف على ${toAr(total)} سؤال ونزلن بالمربع تحت. راجعهن وعدّل اللي تريده، بعدين اضغط «أضف».${fails?` (${toAr(fails)} جزء ما انقرى — جرّب ترفعه مرة ثانية)`:''}`,err:!total});
 }catch(e){pdfSt({busy:0,msg:'خطأ: '+(e.message||e),err:1})}
 const fi=document.getElementById('pdff');if(fi)fi.value='';
}

function uiSave(m){applyTheme();return admSave(m)}
function uiSet(k,v){ADM.cfg.ui=UIc();ADM.cfg.ui[k]=v;uiSave()}
function uiTg(key,i,on){ADM.cfg.ui=UIc();ADM.cfg.ui[key][i].on=on?1:0;uiSave()}
function uiMv(key,i,d){ADM.cfg.ui=UIc();const a=ADM.cfg.ui[key];const j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];uiSave()}
function uiTxt(k,v){ADM.cfg.ui=UIc();if(v.trim())ADM.cfg.ui.txt[k]=v.trim();else delete ADM.cfg.ui.txt[k];uiSave()}
function uiFeat(k,v){ADM.cfg.ui=UIc();ADM.cfg.ui.feat[k]=v?1:0;uiSave()}
function uiNav(k,v){ADM.cfg.ui=UIc();ADM.cfg.ui.nav[k]=v?1:0;uiSave()}
function uiBlkAdd(){ADM.cfg.ui=UIc();ADM.cfg.ui.blocks.push({title:'عنوان البطاقة',body:'',link:'',c:'',ic:'bolt',on:1,g:[]});uiSave()}
function uiBlk(i,k,v){ADM.cfg.ui=UIc();ADM.cfg.ui.blocks[i][k]=v;uiSave()}
function uiBlkG(i,gk){ADM.cfg.ui=UIc();const b=ADM.cfg.ui.blocks[i];b.g=b.g||[];b.g=b.g.includes(gk)?b.g.filter(x=>x!==gk):b.g.concat(gk);uiSave()}
function uiBlkMv(i,d){ADM.cfg.ui=UIc();const a=ADM.cfg.ui.blocks,j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];uiSave()}
function uiBlkDel(i){if(!confirm('تحذف البطاقة؟'))return;ADM.cfg.ui=UIc();ADM.cfg.ui.blocks.splice(i,1);uiSave()}
function uiLogo(file){if(!file)return;const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const s=Math.min(1,256/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);uiSet('logo',c.toDataURL('image/png'))};img.src=r.result};r.readAsDataURL(file)}

/* =====================================================================
   ورقة الأسئلة بشكل الورقة الوزارية + ورقة إجابة تحتها + معاينة متحركة
   (لكل الصفوف ما عدا الأول والثاني والثالث الابتدائي)
   ===================================================================== */
const EARLY=['p1','p2','p3'];
const isEarly=E=>EARLY.includes(E.g.k);
const NUMW2={1:'واحداً',2:'اثنين',3:'ثلاثة',4:'أربعة',5:'خمسة',6:'ستة'};
const INL=['def','fn','loc'];
function offHead(p,en){
 if(en&&KHE[p.k])return KHE[p.k];
 const n=p.choose,N=n?`(${NUMW2[n]||toAr(n)})`:'';
 if(!n)return KH[p.k];
 return {def:`عرّف ${N} مما يأتي:`,why:`علّل ${N} مما يأتي:`,fn:`ما وظيفة ${N} مما يأتي؟`,loc:`أين يوجد ${N} مما يأتي؟`,diff:`ما الفرق بين ${N} مما يأتي؟`,irab:`أعرب ما تحته خط في ${N} مما يأتي:`,fix:`صحّح الخطأ في ${N} مما يأتي مع ذكر السبب:`,tr:`أجب عن ${N} مما يأتي:`}[p.k]||KH[p.k];
}
const QW=['الأول','الثاني','الثالث','الرابع','الخامس','السادس','السابع','الثامن','التاسع','العاشر'];
function mkTxt(m){m=Math.round(m);return `${toAr(m)} ${m>10?'درجة':'درجات'}`}
function pqHTML(E,q,qi){
 const en=E.en,one=q.parts.length===1;
 let h=`<div class="pq" id="pq${qi}" data-q="${qi}">`;
 q.parts.forEach((p,pi)=>{
  const lbl=one?'':`<b class="pl">${AL[pi]})</b> `;
  h+=`<div class="pp"><div class="pph">${one?'':`<span class="pmk">(${mkTxt(p.marks)})</span>`}${lbl}<b>${offHead(p,en)}</b></div>`;
  if(p.k==='psg')h+=`<div class="ppsg">${ulz(p.text)}</div>`;
  if(INL.includes(p.k)&&!en)h+=`<div class="pil">${p.items.map((it,i)=>`<span id="pi_${it.id}">${toAr(i+1)}) ${ulz(stripWz(it.q))}</span>`).join('، ')}</div>`;
  else h+=p.items.map((it,i)=>{
   let x='';if(it.k==='mcq'){const ml=Math.max(...it.o.map(o=>String(o).replace(/<[^>]+>/g,'').length));x=`<div class="pmo ${ml>32?'c1':ml>14?'c2':''}">${it.o.map((o,j)=>`<span><b>${(en?['a','b','c','d']:AL)[j]})</b> ${o}</span>`).join('')}</div>`}
   const tf=it.k==='tf'?`<span class="tfm">(&nbsp; ........... &nbsp;)</span>`:'';
   return `<div class="pit ${it.k==='tf'?'tf':''}" id="pi_${it.id}"><span class="pn">${en?(i+1)+'.':toAr(i+1)+'.'}</span><div class="px">${ulz(stripWz(it.q))}${x}</div>${tf}</div>`}).join('');
  h+=`</div>`;
 });
 return h+`</div>`;
}
function arDate(){try{return new Date().toLocaleDateString('ar-IQ-u-nu-arab',{day:'numeric',month:'numeric',year:'numeric'})}catch(e){return ''}}
function offV(E,R,g,wiz,ul){
 const X=ADM.cfg.exam,sub=SUB[E.sub].n,u=UIc(),nm=esc(u.name);
 const dur=E.quiz?'غير محددة':(V.eb&&V.eb.dur?({30:'نصف ساعة',60:'ساعة واحدة',90:'ساعة ونصف',120:'ساعتان',180:'ثلاث ساعات'}[V.eb.dur]||toAr(V.eb.dur)+' دقيقة'):'ثلاث ساعات');
 const ttl=E.paper?esc(E.paper):E.quiz?'اختبار ذاتي':wiz?'أسئلة وزارية':E.type==='h'?'امتحان نصف السنة':E.type==='m'?'امتحان شهري':'امتحان نهاية السنة';
 const kind=E.quiz?'اختبار ذاتي':wiz?'وزاري':E.type==='h'?'نصف السنة':E.type==='m'?'شهري':'نهاية السنة';
 const tot=E.qs.reduce((t,q)=>t+q.marks,0),best=E.best?E.qs.slice(0,E.best).reduce((t,q)=>t+q.marks,0):tot;
 const note=E.quiz?'أجب عن جميع الأسئلة':E.best?`أجب عن ${NUMW2[E.best]||toAr(E.best)} أسئلة فقط ولكل سؤال (${mkTxt(E.qs[0].marks)})`:'أجب عن جميع الأسئلة بحسب المطلوب';
 let h=`<div class="op np"><i class="sw1"></i><i class="sw2"></i>
 <div class="nph"><div class="npl">${logoHTML()}</div><div class="npc"><div class="npn">منصة ${nm} التعليمية</div><div class="npr"><i></i><span>${ttl}</span><i></i></div></div><div class="nps">مع ${nm} ..<br>نحقق التفوق</div></div>
 <div class="npi"><div><p><b>المدرسة :</b> <i class="d"></i></p><p><b>المادة :</b> ${esc(sub)}</p><p><b>الصف :</b> ${esc(g.n)}</p></div>
 <div><p><b>نوع الامتحان :</b> ${kind}</p><p><b>التاريخ :</b> ${arDate()}</p><p><b>المدة :</b> ${dur}</p></div>
 <div><p><b>اسم الطالب :</b> ${U.name?`<span class="npsn">${esc(U.name)}</span>`:'<i class="d"></i>'}</p><p><b>رقم الامتحان :</b> <i class="d"></i></p></div></div>
 <div class="npb">${note}</div>`;
 E.qs.forEach((q,qi)=>{const skd=(E.skip||[]).includes(qi);
  h+=`<div class="nq ${skd?'skd':''}"><div class="nqh"><span class="nqt">${E.quiz?'السؤال '+toAr(qi+1):'السؤال '+(QW[qi]||toAr(qi+1))} :</span><i></i><span class="nqm">( ${mkTxt(q.marks)} )</span></div><div class="nqb">${pqHTML(E,q,qi)}</div></div>`});
 const sc=R&&E.total!=null?`<div class="nfs">درجتك: <b>${toAr(Math.round(E.total))}</b></div>`:'';
 h+=`<div class="npf"><div class="nfa"><span><b>اسم المصحح :</b> <i class="d"></i></span><span><b>التوقيع :</b> <i class="d s"></i></span></div><div class="nft">الدرجة الكلية : <b>( ${toAr(Math.round(best))} )</b> درجة${sc}</div></div>
 <div class="npe">انتهت الأسئلة — مع تمنياتنا لكم بالنجاح والتفوق</div>${X.wm?`<div class="opw">${esc(X.wm)}</div>`:''}</div>`;
 h+=`<button class="gotoans" onclick="document.getElementById('asheet').scrollIntoView({behavior:'smooth'})">${I('edit',18)} ابدأ الإجابة</button>`;
 // ورقة الإجابة + المعاينة المتحركة
 h+=`<div class="as" id="asheet"><div class="pv" id="pv"><div class="pvh" onclick="togglePv()"><span>${I('eye',16)} السؤال: <b id="pvt">${QN[0]}</b></span><span class="pvx" id="pvx">إخفاء ▴</span></div><div class="pvb" id="pvb"></div></div>
 <div class="ash">ورقة الإجابة</div>`;
 E.qs.forEach((q,qi)=>{
  const qm=toAr(Math.round(q.marks));
  const skd=(E.skip||[]).includes(qi);
  h+=`<section class="aq ${skd?'skd':''}" id="qc${qi}" data-q="${qi}"><div class="aqh"><b>جواب ${E.quiz?'س'+toAr(qi+1):QN[qi]}/</b>${R?`<span class="red" style="color:${scoreCol(q.sc/q.marks*100)}">${skd?'متروك':`${toAr(+q.sc.toFixed(1))}/${qm}${E.drop&&E.drop.includes(qi)?' · غير محتسب':''}`}</span>`:`<span>${qm} درجة</span>`}</div>
  ${E.best&&!R?`<button class="skipb ${skd?'on':''}" onclick="toggleSkip(${qi})">${skd?'✓ تركت هذا السؤال — اضغط للتراجع':'اترك هذا السؤال'}</button>`:''}`;
  if(skd&&!R){h+=`<div class="skn">هذا السؤال متروك ولا يُحتسب. تجاوب على ${toAr(E.best)} أسئلة فقط.</div></section>`;return}
  q.parts.forEach((p,pi)=>{
   h+=`<div class="ap">${q.parts.length>1?`<div class="aph"><b>${AL[pi]})</b>${p.choose?`<span class="ch">أجب عن ${NUMW2[p.choose]} فقط</span>`:''}</div>`:p.choose?`<div class="aph"><span class="ch">أجب عن ${NUMW2[p.choose]} فقط</span></div>`:''}`;
   p.items.forEach((it,i)=>{h+=ansItem(E,it,i,R)});
   h+=`</div>`});
  h+=`</section>`});
 h+=`</div>`;
 return h;
}
function ansItem(E,it,i,R){
 const en=E.en,v=E.ans[it.id],dis=R?'disabled':'';let inp='';
 const L=en?['a','b','c','d']:AL;
 const qq=stripWz(it.q);const lab=it.k==='mcq'||it.k==='tf'?'':`<div class="alab">${ulz(qq.length>70?qq.slice(0,70)+'…':qq)}</div>`;
 if(it.k==='mcq')inp=`<div class="abub">${it.o.map((o,j)=>`<button class="opt ${v==j?'on':''} ${R?(j===it.a?'right':(v==j?'wrong':'')):''}" data-id="${it.id}" data-v="${j}" ${dis}><i>${L[j]}</i></button>`).join('')}</div>`;
 else if(it.k==='tf'){const c=it.a?'t':'f';inp=`<div class="abub">${[['t',en?'T':'صح'],['f',en?'F':'خطأ']].map(o=>`<button class="opt w ${v===o[0]?'on':''} ${R?(o[0]===c?'right':(v===o[0]?'wrong':'')):''}" data-id="${it.id}" data-v="${o[0]}" ${dis}><i>${o[1]}</i></button>`).join('')}</div>`}
 else if(['def','why','fn','loc','diff','irab','fix','tr'].includes(it.k))inp=`<textarea class="aa" rows="2" data-id="${it.id}" placeholder="${en?'Answer…':'الجواب…'}" ${dis}>${v||''}</textarea>`;
 else{const ltr=it.k==='dna'||en||it.l;inp=`<input class="aa one ${ltr?'ltr':''}" data-id="${it.id}" value="${String(v||'').replace(/"/g,'&quot;')}" placeholder="${it.k==='calc'?'الناتج':en?'Answer':'الجواب'}" ${dis}>`}
 let fb='';
 if(R){const ok=it.sc>=it.mk-1e-6,half=!ok&&it.sc>0,cls=ok?'ok':half?'half':'no';
  fb=`<div class="xfb ${cls}"><div class="r1"><b>${ok?'صحيحة':half?'جزئية':v?'خاطئة':'لم تُجب'}</b><span>${toAr(+it.sc.toFixed(1))} / ${toAr(+it.mk.toFixed(1))}${it.self?' · تصحيح ذاتي':''}${it.ai?' · صُحّح بالمعنى':''}</span></div>${!ok?`<div class="ma"><small>الإجابة الصحيحة</small>${it.k==='mcq'?it.o[it.a]:it.k==='tf'?(it.a?'صح':'خطأ'):correctText(it)}</div>`:''}${!ok&&!['mcq','tf','dna','calc'].includes(it.k)&&v?`<button class="selfok" onclick="selfFix('${it.id}')">${I('check',14)} جوابي صحيح بنفس المعنى — احسبه</button>`:''}<button class="rep" onclick="report('${it.id}')">${I('flag',12)} إبلاغ</button></div>`}
 return `<div class="ai" data-id="${it.id}" onfocusin="pvFocus('${it.id}')"><span class="an">${en?(i+1)+'.':toAr(i+1)+'-'}</span><div class="ab">${lab}${inp}${fb}</div></div>`;
}
/* ----- المعاينة المتحركة ----- */
let PVQ=-1,PVOFF=false;
function togglePv(){PVOFF=!PVOFF;const b=$('#pvb'),x=$('#pvx');if(b)b.style.display=PVOFF?'none':'';if(x)x.textContent=PVOFF?'إظهار ▾':'إخفاء ▴'}
function pvSet(qi){if(qi===PVQ)return;PVQ=qi;const src=document.getElementById('pq'+qi),b=$('#pvb'),t=$('#pvt');if(!src||!b)return;b.innerHTML=src.innerHTML.replace(/id="pi_/g,'data-pi="');if(t)t.textContent=V.exam.quiz?'س'+toAr(qi+1):QN[qi];b.scrollTop=0}
function pvFocus(id){const sec=document.querySelector(`.ai[data-id="${id}"]`);if(!sec)return;setTimeout(()=>pvClear(sec),350);const q=sec.closest('.aq');if(q)pvSet(+q.dataset.q);
 const b=$('#pvb');if(!b)return;b.querySelectorAll('.hl').forEach(x=>x.classList.remove('hl'));const t=b.querySelector(`[data-pi="${id}"]`);if(t){t.classList.add('hl');const top=t.offsetTop-b.offsetTop-8;b.scrollTo({top,behavior:'smooth'})}}
function pvScroll(){if(V.scr!=='exam'||!$('#asheet'))return;const eb=document.querySelector('.ebar'),pv=$('#pv');const line=(eb?eb.getBoundingClientRect().bottom:0)+(pv?pv.offsetHeight:0)+20;
 let cur=0;document.querySelectorAll('.aq').forEach(s=>{if(s.getBoundingClientRect().top<=line)cur=+s.dataset.q});pvSet(cur)}
function initPv(){PVQ=-1;lockZoom(true);vvFix();const eb=document.querySelector('.ebar');if(eb)document.documentElement.style.setProperty('--ebh',eb.offsetHeight+'px');pvSet(0);if(PVOFF){PVOFF=false;togglePv()}}
window.addEventListener('scroll',()=>{if(V.scr==='exam')requestAnimationFrame(pvScroll)},{passive:true});
/* ثبات المعاينة مع الكيبورد والتكبير */
function vvFix(){const vv=window.visualViewport,r=document.documentElement;if(!vv)return;
 const ex=V.scr==='exam';const ot=ex?Math.max(0,vv.offsetTop):0;r.style.setProperty('--vvt',ot+'px');r.style.setProperty('--vvh',vv.height+'px');
 const eb=document.querySelector('.ebar');if(eb&&ex)r.style.setProperty('--ebh',eb.offsetHeight+'px');
 if(ex)requestAnimationFrame(pvScroll)}
if(window.visualViewport){visualViewport.addEventListener('resize',vvFix);visualViewport.addEventListener('scroll',vvFix)}
function pvClear(sec){const pv=$('#pv');if(!pv||!sec)return;const a=document.activeElement;const el=(a&&sec.contains(a))?a:sec;const r=el.getBoundingClientRect(),pb=pv.getBoundingClientRect().bottom;const vv=window.visualViewport;const vb=vv?vv.offsetTop+vv.height:innerHeight;
 if(r.top<pb+8)scrollBy({top:r.top-pb-12,behavior:'smooth'});else if(r.bottom>vb-8)scrollBy({top:r.bottom-vb+16,behavior:'smooth'})}
function lockZoom(on){const m=document.querySelector('meta[name=viewport]');if(!m)return;m.setAttribute('content','width=device-width, initial-scale=1, viewport-fit=cover'+(on?', maximum-scale=1':''))}

function toggleSkip(qi){const E=V.exam;E.skip=E.skip||[];const max=E.qs.length-E.best;
 if(E.skip.includes(qi))E.skip=E.skip.filter(x=>x!==qi);
 else{if(E.skip.length>=max){if(max===1)E.skip=[qi];else return toast(`تگدر تترك ${toAr(max)} أسئلة بس`)}else E.skip.push(qi)}
 const y=scrollY;render();scrollTo(0,y)}
/* ---------- تشغيل ---------- */
function bootRoute(){if(location.hash==='#admin'){V.scr='admin'}}
window.addEventListener('hashchange',()=>{if(location.hash==='#admin')go('admin')});
(async function boot(){
 if(!SB){const d=LS.get('adm',null);if(d){ADM.cfg=admMerge(d.cfg);ADM.qs=d.qs||[]}ADM.loaded=true}
 else{
  // آخر نسخة محفوظة بالجهاز تطلع فوراً، وللزائر الجديد نعرض شاشة تحميل لحد ما توصل الهوية الصحيحة
  const c=LS.get('cache',null);
  if(c&&c.cfg){ADM.cfg=admMerge(c.cfg);ADM.qs=c.qs||[]}
  else{const a=document.getElementById('app');if(a)a.innerHTML='<div class="splash"><i></i></div>';
   await Promise.race([AST.load(),new Promise(r=>setTimeout(r,4000))])}
 }
 buildCUR();applyTheme();bootRoute();render();
 if(SB){
  const before=JSON.stringify(ADM.cfg)+'|'+ADM.qs.length;
  await Promise.all([AST.load(),admSession()]);
  try{localStorage.setItem('saffi_cache',JSON.stringify({cfg:ADM.cfg,qs:ADM.qs}))}catch(e){try{localStorage.setItem('saffi_cache',JSON.stringify({cfg:ADM.cfg,qs:[]}))}catch(e2){}}
  const after=JSON.stringify(ADM.cfg)+'|'+ADM.qs.length;
  if(before!==after||V.scr==='admin'){buildCUR();applyTheme();if(V.scr!=='exam')render()}
 }
})();

/* ---------- تصحيح بالمعنى عبر الذكاء الاصطناعي (اختياري) ---------- */
async function aiGrade(E){
 if(!SB||!ADM.cfg.exam.ai)return;
 const W=['def','why','fn','loc','diff','irab','fix','tr'];
 const list=[];E.qs.forEach(q=>q.parts.forEach(p=>p.items.forEach(it=>{const v=E.ans[it.id];if(W.includes(it.k)&&v&&String(v).trim().length>1&&it.sc<it.mk-1e-6)list.push(it)})));
 if(!list.length)return;
 try{
  const call=SB.functions.invoke('grade',{body:{items:list.map(it=>({q:it.q,model:[it.m].concat(it.alts||[]).filter(Boolean).join(' || '),answer:String(E.ans[it.id]).slice(0,800)}))}});
  const r=await Promise.race([call,new Promise(res=>setTimeout(()=>res(null),15000))]);
  const sc=r&&r.data&&r.data.scores;if(!Array.isArray(sc))return;
  sc.forEach(s=>{const it=list[s.i];if(!it)return;const v=Math.max(0,Math.min(1,+s.v||0));const nv=Math.round(v*it.mk*2)/2;if(nv>it.sc){it.sc=Math.min(it.mk,nv);it.ai=1}});
 }catch(e){console.warn('ai grade',e)}
}
